# Local development services. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: scopewise-postgres
    environment:
      POSTGRES_DB: scopewise
      POSTGRES_USER: scopewise
      POSTGRES_PASSWORD: scopewise
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scopewise"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
